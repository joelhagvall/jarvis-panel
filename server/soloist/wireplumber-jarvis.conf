# Jarvis: BlueALSA owns Bluetooth (MPD radio to the JBL). WirePlumber must not register its own A2DP endpoints,
# and the Pi's own ALSA devices are not used. Only the static "jbl" sink below exists (Soloist, 2026-10-28).
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.libcamera = disabled
    monitor.v4l2 = disabled
  }
}

# Soloist sets its own stream volume. WirePlumber must never restore a saved one onto it: on 2026-11-01 a silent
# pw-play at volume 0 saved 0 for media.role Music, and every Spotify stream after it played at volume 0 (silent
# while "playing"). docs/spotify.md.
stream.rules = [
  {
    matches = [ { application.name = "Spotify" } ]
    actions = { update-props = { state.restore-props = false } }
  }
]
