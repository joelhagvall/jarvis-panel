# Jarvis: "JBL 45 varv", the turntable's 45 rpm (Joel, 2026-10-28). A PipeWire client (run by
# hallpanel-jbl45.service: pipewire -c this file) with one filter-chain sink, "jbl45", that pitches what it gets up
# by 45/33 1/3 (5 semitones 20 cents, the voice's formants too, as a real 45 does) and plays it on the "jbl" sink
# (pipewire-jbl.conf). Spotify only goes through it while the panel's speed knob says 45 (server/speed.py moves
# Soloist's streams); the tempo stays, as Spotify streams in real time. Needs rubberband-ladspa (apt).
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "JBL 45 varv"
            media.name       = "JBL 45 varv"
            filter.graph = {
                nodes = [
                    { type = ladspa name = rb plugin = "ladspa-rubberband" label = "rubberband-pitchshifter-stereo"
                      control = { "Semitones" = 5 "Cents" = 20 "Crispness" = 3 "Formant Preserving" = 0 } }
                ]
                inputs  = [ "rb:Input L" "rb:Input R" ]
                outputs = [ "rb:Output L" "rb:Output R" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props  = { node.name = "jbl45" media.class = "Audio/Sink" audio.rate = 44100 }
            playback.props = { node.name = "jbl45.out" target.object = "jbl" node.passive = true audio.rate = 44100 }
        }
    }
]
