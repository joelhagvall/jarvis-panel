# Jarvis: a sink that plays through BlueALSA to the connected speaker (the JBL), for Spotify Soloist.
# It holds the device only while something plays, so MPD can use it the rest of the time.
# 2026-10-28: with PipeWire's defaults (timer scheduling, mmap, 1024-frame quantum at 48 kHz) the JBL stuttered:
# 95 xruns in a few minutes and BlueALSA logging "PCM drop/resume". BlueALSA is an ALSA plugin without real mmap
# or a hardware clock, so it gets period wakeups, plain writes, bigger periods and the stream's own 44.1 kHz.
context.properties = {
  default.clock.rate          = 44100
  default.clock.allowed-rates = [ 44100 48000 ]
}
context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "jbl"
      node.description = "JBL via BlueALSA"
      media.class      = "Audio/Sink"
      api.alsa.path    = "bluealsa"
      api.alsa.disable-mmap   = true
      api.alsa.disable-tsched = true
      api.alsa.period-size    = 2048
      api.alsa.period-num     = 4
      api.alsa.headroom       = 2048
      audio.rate       = 44100
      audio.channels   = 2
      node.latency     = "2048/44100"
      node.pause-on-idle = true
      session.suspend-timeout-seconds = 2
    }
  }
]
