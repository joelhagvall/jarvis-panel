# MPD for Jarvis's Bluetooth speaker (server/agents/speaker.py, docs/bluetooth-speaker.md).
# It plays only the radio's streams, sent by radio.py: no music library, no database. Home Assistant
# shows it as media_player.bluetooth_hogtalare. Run by hallpanel-mpd.service, on 127.0.0.1 only.
# Port 6601, not 6600: Debian's own mpd.socket (disabled by setup.sh) would take 6600.
bind_to_address "127.0.0.1"
port            "6601"
state_file      "~/.local/share/hallpanel/mpd/state"
# Home Assistant's MPD player asks for stored playlists and logs a warning when they are disabled.
playlist_directory "~/.local/share/hallpanel/mpd/playlists"
zeroconf_enabled "no"
auto_update     "no"

# "bluealsa" is BlueALSA's ALSA device. Without DEV it is the speaker connected last, so any paired
# speaker works without changing this file. The volume is MPD's own: the speaker keeps its buttons.
audio_output {
    type        "alsa"
    name        "Bluetooth"
    device      "bluealsa"
    mixer_type  "software"
}
